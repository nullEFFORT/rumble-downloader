[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rumble-downloader"
version = "1.0.0"
description = "Self-hosted YouTube/Rumble video downloader with web UI, scheduled downloads, and clip filtering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "yt-dlp>=2024.1.0",
    "apscheduler>=3.10.0",
    "feedparser>=6.0.0",
    "gunicorn>=21.0.0",
]

[project.scripts]
rumble-downloader = "run:main"

[tool.setuptools.packages.find]
include = ["app*"]
